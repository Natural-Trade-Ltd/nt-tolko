<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolko · Centro de Análisis NT</title>
<style>
/* ============ Dueto Tierra — tokens ============ */
:root{
  --bg:#F2EDE3; --card:#FBF8F1; --line:#E0D8C8; --ink:#3A3129; --sub:#71655A; --faint:#9C8F80;
  --acc:#587F6B; --accInk:#F6FBF7; --acc2:#8A6F5B;
  --riesgo:#AE4E2B; --alerta:#9A6A12; --info:#3D6F9E; --ok:#587F6B;
  --okBg:#E4EDE7; --alertaBg:#F5EBD6; --riesgoBg:#F6E3DA; --infoBg:#E4EDF6;
  --sombra:0 1px 2px rgba(58,49,41,.05), 0 10px 30px rgba(58,49,41,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1713; --card:#241F1A; --line:#3A322A; --ink:#F0EAE0; --sub:#BCAFA0; --faint:#8D8072;
    --acc:#8FB89F; --accInk:#17241C; --acc2:#C9A87F;
    --riesgo:#E0785A; --alerta:#E0B463; --info:#7FA8D8; --ok:#8FB89F;
    --okBg:#1E2E24; --alertaBg:#33291A; --riesgoBg:#33211B; --infoBg:#1C2836;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1713; --card:#241F1A; --line:#3A322A; --ink:#F0EAE0; --sub:#BCAFA0; --faint:#8D8072;
  --acc:#8FB89F; --accInk:#17241C; --acc2:#C9A87F;
  --riesgo:#E0785A; --alerta:#E0B463; --info:#7FA8D8; --ok:#8FB89F;
  --okBg:#1E2E24; --alertaBg:#33291A; --riesgoBg:#33211B; --infoBg:#1C2836;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:400; line-height:1.55; font-size:15px;
}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
a{color:var(--acc)}
/* ============ layout ============ */
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:16px 22px 10px; max-width:1280px; margin:0 auto;
}
.logo-placa{display:inline-flex; align-items:center; border-radius:8px; padding:0}
:root[data-theme="dark"] .logo-placa{background:#F7F5EC; padding:3px 8px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-placa{background:#F7F5EC; padding:3px 8px} }
.logo-placa img{height:30px; display:block}
.titulo h1{font-weight:500; font-size:24px; margin:0; letter-spacing:-.01em; text-wrap:balance}
.titulo .eyebrow{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--acc2); margin:0}
.head-right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date],input[type=password],textarea{
  background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px;
  padding:8px 10px; font:inherit; font-size:14px;
}
textarea{width:100%; min-height:130px; border-radius:12px}
button{
  background:var(--acc); color:var(--accInk); border:0; border-radius:12px; padding:9px 16px;
  font:inherit; font-size:14px; font-weight:600; cursor:pointer;
}
button.sec{background:var(--card); color:var(--ink); border:1px solid var(--line)}
button.mini{padding:5px 10px; font-size:12.5px; border-radius:10px}
button:disabled{opacity:.5; cursor:default}
nav{
  display:flex; gap:6px; padding:6px 22px 14px; max-width:1280px; margin:0 auto;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
nav button{background:var(--card); color:var(--sub); border:1px solid var(--line); white-space:nowrap}
nav button.on{background:var(--acc); color:var(--accInk); border-color:var(--acc)}
main{max-width:1280px; margin:0 auto; padding:0 22px 60px}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sombra); padding:16px 18px; margin-bottom:16px}
.card h2{font-weight:600; font-size:16px; margin:0 0 10px}
.card h3{font-weight:600; font-size:14px; margin:14px 0 6px; color:var(--sub)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px}
.kpis{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 18px; min-width:130px}
.kpi .v{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:26px; font-weight:600; color:var(--acc); font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.chip{display:inline-block; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:600}
.chip.ok{background:var(--okBg); color:var(--ok)}
.chip.alerta{background:var(--alertaBg); color:var(--alerta)}
.chip.riesgo{background:var(--riesgoBg); color:var(--riesgo)}
.chip.info{background:var(--infoBg); color:var(--info)}
.chip.neutro{background:var(--bg); color:var(--sub); border:1px solid var(--line)}
.tabla-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th{
  text-align:left; font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  cursor:pointer; user-select:none; background:var(--card); position:sticky; top:0;
}
td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top}
tr:last-child td{border-bottom:0}
tr.sel-row td{background:var(--okBg)}
td.r,th.r{text-align:right}
.precio{font-weight:600; font-variant-numeric:tabular-nums}
.est{color:var(--alerta)}
.filtros{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.filtros label{font-size:12.5px; color:var(--sub); display:flex; align-items:center; gap:5px}
.nota{font-size:12.5px; color:var(--sub)}
.regla{width:60px; height:3px; background:var(--acc2); border-radius:2px; margin:4px 0 10px}
pre.oferta{
  background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px;
  white-space:pre-wrap; font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace; font-size:13px;
}
#login{
  position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center; justify-content:center;
}
#login .caja{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sombra); padding:34px 36px; width:340px; text-align:center}
#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:60;
  background:var(--ink); color:var(--bg); border-radius:12px; padding:10px 18px; font-size:14px;
  opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw;
}
#toast.riesgo{background:var(--riesgo); color:#fff}
.leyenda{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.oculto{display:none !important}
.sel-fab{
  position:fixed; right:18px; bottom:18px; z-index:40; box-shadow:var(--sombra);
}
@media (max-width:640px){ header{padding:12px 14px 6px} main{padding:0 12px 80px} nav{padding:4px 12px 10px} }
</style>
</head>

    <h1 class="serif" style="font-weight:500;font-size:26px;margin:6px 0 2px">Portal Tolko</h1>
    <div class="regla" style="margin:10px auto 16px"></div>
    <input type="password" id="clave-in" placeholder="Clave de acceso" style="width:100%">
    <p id="login-err" class="nota" style="color:var(--riesgo);min-height:18px"></p>
    <button style="width:100%" onclick="entrar()">Entrar</button>
  </div>
</div>

  <button data-v="historicos" onclick="ir('historicos')">Históricos</button>
  <button data-v="config" onclick="ir('config')">Configuración</button>
  <button data-v="cargar" onclick="ir('cargar')">Cargar lista</button>
</nav>

<main>
  <section id="v-resumen"></section>
  <section id="v-explorador" class="oculto"></section>
  <section id="v-seleccion" class="oculto"></section>
  <section id="v-historicos" class="oculto"></section>
  <section id="v-config" class="oculto"></section>
  <section id="v-cargar" class="oculto"></section>
</main>

<button id="sel-fab" class="sel-fab oculto" onclick="ir('seleccion')">Ver selección (<span id="sel-fab-n">0</span>)</button>
<div id="toast"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="parser.js"></script>
<script>
'use strict'
const API = 'https://borouviqngtdzfvlmlur.supabase.co/functions/v1/tolko-api'
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
const S = {
  clave: localStorage.tolkoClave || '', boot: null, fecha: null, items: [], showDups: false,
  filtros: { pestana:'', size:'', species:'', mill:'', prompt:false, carros:false, q:'' },
  sort: { col:'c1', dir:1 }, sel: new Map(), destinoSel: localStorage.tolkoDestino || 'El Paso',
  ajuste: 0, vista: 'resumen', serieModo: 'usmill',
}

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id)
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const f$ = n => n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US')
function toast(msg, mal) {
  const t = $('toast'); t.textContent = msg; t.className = mal ? 'riesgo' : ''
  t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 3200)
}
async function api(action, data = {}, reintento) {
  let r
  try {
    r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ clave: S.clave, action, ...data }) })
  } catch (e) {
    if (!reintento) { await new Promise(x => setTimeout(x, 700)); return api(action, data, true) }
    throw e
  }
  const j = await r.json().catch(() => ({ error: 'respuesta inválida' }))
  if (!r.ok || j.error) throw new Error(j.error || r.status)
  return j
}
function fmtFecha(iso) {
  if (!iso) return ''
  const [y, m, d] = iso.split('-').map(Number)
  return `${d}-${MESES[m - 1]}`
}
function fmtStatus(st) {
  if (st === 'PMT') return '<span class="chip ok">Prompt</span>'
  if (st === 'SOLD') return '<span class="chip riesgo">Vendido</span>'
  if (/^\d{4}-/.test(st || '')) return `<span class="chip alerta">Emb ${fmtFecha(st)}</span>`
  return `<span class="chip neutro">${esc(st || '—')}</span>`
}
function statusTxt(st) {
  if (st === 'PMT') return 'Prompt'
  if (/^\d{4}-/.test(st || '')) return 'Emb ' + fmtFecha(st)
  return st || ''
}
function tallyTxt(it) {
  if (!it.tally) return ''
  const ks = Object.keys(it.tally)
  const numeric = ks.every(k => /^\d+$/.test(k))
  if (numeric) return ks.sort((a, b) => a - b).map(k => `${it.tally[k]}/${k}'`).join(' ')
  return ks.map(k => `${it.tally[k]} pqt ${k}`).join(' · ')
}
function gradeTxt(g) {
  if (g === 'A-GRADE') return 'A-Grade'
  if (g === 'J-GRADE') return 'J-Grade'
  if (g === 'STUD') return 'Stud'
  if (g === 'PREM') return 'Prem'
  return g || ''
}

/* ---------- parámetros y costos ---------- */
const param = c => { const p = (S.boot?.params || []).find(p => p.clave === c); return p ? p.valor : null }
const descuento = () => { const d = parseFloat(param('descuento')); return isFinite(d) ? d : 0.25 }
function spread(size) { const sp = param('spread_chi_usmill') || {}; const v = sp[size] ?? sp.default; return v == null ? 122 : +v }
const fletes = () => (S.boot?.fletes || []).filter(f => f.activo !== false)
const destinos = () => [...new Set(fletes().map(f => f.destino))]
function flete(destino, grupo) { const f = fletes().find(f => f.destino === destino && f.grupo_flete === grupo); return f ? +f.usd_mbf : null }
const factorCdn = () => { const f = parseFloat(param('factor_cdn_usmill')); return isFinite(f) && f > 0 ? f : 1.134409 }
const fxMercado = () => { const f = parseFloat(param('fx_usdcad')); return isFinite(f) && f > 0 ? f : 1.3865 }
function usmillEff(it) {
  if (it.precio_usmill != null) return { v: +it.precio_usmill, est: false, src: 'US' }
  if (it.precio_cdnmill != null) return { v: +it.precio_cdnmill / factorCdn(), est: false, src: 'CDN' }
  if (it.precio_chi != null) return { v: +it.precio_chi - spread(it.size), est: true, src: '≈' }
  return null
}
function costo(it, destino) {
  const u = usmillEff(it); if (!u || !it.grupo_flete) return null
  const f = flete(destino, it.grupo_flete); if (f == null) return null
  return { v: Math.floor(u.v * (1 - descuento()) + f), est: u.est }
}
function costoTxt(c) {
  if (!c) return '<td class="r">—</td>'
  return `<td class="r precio">${c.est ? '<span class="est" title="US MILL estimado (Chicago − spread)">≈</span>' : ''}$${c.v}</td>`
}

/* ---------- arranque / datos ---------- */
async function entrar() {
  S.clave = $('clave-in').value.trim()
  try {
    await cargarBoot()
    localStorage.tolkoClave = S.clave
    $('login').classList.add('oculto')
  } catch (e) { $('login-err').textContent = 'Clave incorrecta o sin conexión (' + e.message + ')' }
}
async function cargarBoot() {
  S.boot = await api('bootstrap')
  const fechas = [...new Set(S.boot.listas.map(l => l.fecha))].sort().reverse()
  if (!S.fecha || !fechas.includes(S.fecha)) S.fecha = fechas[0] || null
  $('fecha-sel').innerHTML = fechas.map(f => `<option value="${f}" ${f === S.fecha ? 'selected' : ''}>Lista ${fmtFecha(f)} ${f.slice(0,4)}</option>`).join('') || '<option>—</option>'
  await cargarItems()
}
async function cargarItems() {
  S.items = []
  if (S.fecha) {
    const ids = S.boot.listas.filter(l => l.fecha === S.fecha).map(l => l.id)
    if (ids.length) {
      const r = await api('items', { lista_ids: ids })
      const listaDe = Object.fromEntries(S.boot.listas.map(l => [l.id, l]))
      S.items = r.items.map(it => {
        for (const k of ['precio_chi', 'precio_usmill', 'precio_cdnmill', 'mbf_est']) it[k] = it[k] == null ? null : parseFloat(it[k])
        it.fuente = listaDe[it.lista_id]?.fuente || ''
        return it
      })
      unirCdn()
      recalibrarFactor()
    }
  }
  renderTodo()
}
/* Une la lista CDN con la US (los archivos son gemelos renglón a renglón):
   al item US se le pega el CDN MILL y el duplicado CDN se oculta */
const tallySig = t => Object.entries(t || {}).map(([k, v]) => k + ':' + v).sort().join(',')
const kOf = it => [it.pestana, it.mill, it.size, it.grade, it.species, it.status, tallySig(it.tally)].join('|')
function unirCdn() {
  const cdn = S.items.filter(i => i.fuente === 'xlsx_cdn')
  if (!cdn.length) return
  const idx = new Map(cdn.map(i => [kOf(i), i]))
  for (const it of S.items) {
    if (it.fuente !== 'xlsx_semanal') continue
    const m = idx.get(kOf(it))
    if (m) { if (it.precio_cdnmill == null) it.precio_cdnmill = m.precio_cdnmill; m._dup = true }
  }
}
function factorObservado() {
  const pares = S.items.filter(i => i.precio_usmill != null && i.precio_cdnmill != null)
  let rs = pares.filter(i => i.precio_cdnmill % 1 !== 0) // sin redondear (del xlsx) = más precisos
  if (rs.length < 5) rs = pares
  const xs = rs.map(i => i.precio_cdnmill / i.precio_usmill).filter(x => x > 0.8 && x < 1.8).sort((a, b) => a - b)
  return xs.length >= 5 ? xs[Math.floor(xs.length / 2)] : null
}
async function recalibrarFactor() {
  const obs = factorObservado()
  if (!obs) return
  if (Math.abs(obs - factorCdn()) / factorCdn() > 0.002) {
    try {
      const v = Math.round(obs * 1e6) / 1e6
      await api('set_param', { param: 'factor_cdn_usmill', valor: v })
      const p = (S.boot.params || []).find(p => p.clave === 'factor_cdn_usmill')
      if (p) p.valor = v; else S.boot.params.push({ clave: 'factor_cdn_usmill', valor: v })
      toast('Factor CDN→US MILL recalibrado: ' + v.toFixed(4))
    } catch (e) { /* silencioso */ }
  }
}
async function recargar() { try { await cargarBoot(); toast('Datos recargados') } catch (e) { toast('Error: ' + e.message, true) } }
async function cambiarFecha(f) { S.fecha = f; await cargarItems() }

function itemsVisibles() {
  let arr = S.items.filter(it => !it._dup)
  const hayCorreo = arr.some(it => it.fuente === 'email_lowgrade')
  if (hayCorreo && !S.showDups) arr = arr.filter(it => it.pestana !== '#3 & ECON')
  return arr
}
const fuenteLabel = f => f === 'email_lowgrade' ? 'Correo Low Grade' : f === 'xlsx_semanal' ? 'Excel US' : f === 'xlsx_cdn' ? 'Excel CDN' : f

/* ---------- navegación / render ---------- */
function ir(v) {
  S.vista = v
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v))
  for (const s of ['resumen', 'explorador', 'seleccion', 'historicos', 'config', 'cargar'])
    $('v-' + s).classList.toggle('oculto', s !== v)
  renderVista()
}
function renderTodo() { renderVista(); renderSelBadge() }
function renderVista() {
  if (S.vista === 'resumen') renderResumen()
  if (S.vista === 'explorador') renderExplorador()
  if (S.vista === 'seleccion') renderSeleccion()
  if (S.vista === 'historicos') renderHistoricos()
  if (S.vista === 'config') renderConfig()
  if (S.vista === 'cargar') renderCargar()
}

/* ---------- RESUMEN ---------- */
function renderResumen() {
  const arr = itemsVisibles()
  const prompt = arr.filter(i => i.es_prompt)
  const carros = prompt.filter(i => i.es_carro)
  const mbf = prompt.reduce((a, i) => a + (i.mbf_est || 0), 0)
  const reales = arr.filter(i => { const u = usmillEff(i); return u && !u.est })
  const d = S.destinoSel

  // oportunidades: Δ vs mediana del grupo (size|grade|species) en el destino elegido
  const grupos = {}
  for (const it of arr) {
    const c = costo(it, d); if (!c) continue
    const k = [it.size, it.grade, it.species].join('|')
    ;(grupos[k] = grupos[k] || []).push(c.v)
  }
  const mediana = xs => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)] }
  const meds = Object.fromEntries(Object.entries(grupos).map(([k, xs]) => [k, mediana(xs)]))
  const ops = arr.map(it => {
    const c = costo(it, d); if (!c) return null
    const k = [it.size, it.grade, it.species].join('|')
    return { it, c, dlt: c.v - meds[k], n: grupos[k].length }
  }).filter(Boolean).filter(o => o.n >= 2 && o.dlt <= 0)
    .sort((a, b) => (a.dlt - b.dlt) || (b.it.es_prompt - a.it.es_prompt))
    .slice(0, 12)

  $('v-resumen').innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="v num">${arr.length}</div><div class="l">Items en lista</div></div>
    <div class="kpi"><div class="v num">${prompt.length}</div><div class="l">Prompt</div></div>
    <div class="kpi"><div class="v num">${carros.length}</div><div class="l">Carros completos prompt</div></div>
    <div class="kpi"><div class="v num">${Math.round(mbf).toLocaleString('en-US')}</div><div class="l">MBF prompt</div></div>
    <div class="kpi"><div class="v num">${reales.length}</div><div class="l">Con precio real (US/CDN)</div></div>
  </div>
  <div class="card">
    <h2>Top oportunidades — costo puesto en
      <select onchange="S.destinoSel=this.value;localStorage.tolkoDestino=this.value;renderResumen()">
        ${destinos().map(x => `<option ${x === d ? 'selected' : ''}>${x}</option>`).join('')}
      </select>
    </h2>
    <p class="nota">Fórmula: US MILL × ${(100 - descuento() * 100).toFixed(0)}% + flete a frontera. Donde no hay US MILL publicado se deriva de la lista CDN (CDN MILL ÷ ${factorCdn().toFixed(4)}). Δ compara contra la mediana de su grupo (medida + grado + especie). ≈ = estimado con spread (solo si falta la lista CDN).</p>
    <div class="tabla-wrap"><table>
      <tr><th></th><th>Producto</th><th>Mill</th><th>Tally</th><th>Vol</th><th>Status</th><th class="r">US MILL</th><th class="r">${esc(d)}</th><th class="r">Δ grupo</th></tr>
      ${ops.map(o => filaOp(o)).join('') || '<tr><td colspan="9" class="nota">Sin datos suficientes.</td></tr>'}
    </table></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Fletes vigentes (USD/MBF)</h2>${tablaFletesMini()}</div>
    <div class="card"><h2>Notas de la lista</h2>
      <p class="nota">Fuentes cargadas el ${fmtFecha(S.fecha)}: ${S.boot.listas.filter(l => l.fecha === S.fecha).map(l => `<span class="chip neutro">${fuenteLabel(l.fuente)}</span>`).join(' ')}</p>
      <p class="nota">La lista CDN trae el precio en aserradero (CAD) de TODAS las pestañas: se une renglón a renglón con la US y cierra el costo real (US MILL = CDN ÷ factor). El correo Low Grade trae US MILL directo para #3/ECON.</p>
      <p class="nota">Prompt = rojo en la lista de Tolko = embarque inmediato. "Emb dd-mmm" = semana de producción. Ojo: pagar la lista CDN en CAD al FX de mercado (${fxMercado()}) NO equivale al 25% — tu trato en USD es mejor mientras USDCAD esté abajo de ${(factorCdn() / (1 - descuento())).toFixed(2)}.</p>
    </div>
  </div>`
}
function filaOp(o) {
  const it = o.it, u = usmillEff(it)
  return `<tr class="${S.sel.has(it.id) ? 'sel-row' : ''}">
    <td><input type="checkbox" ${S.sel.has(it.id) ? 'checked' : ''} onchange="togSel('${it.id}')"></td>
    <td><b>${esc(it.species || '')} ${esc(it.size || '')} ${esc(gradeTxt(it.grade))}</b><br><span class="nota">${esc(it.pestana)}</span></td>
    <td>${esc(it.mill || '')}</td>
    <td>${esc(tallyTxt(it))}</td>
    <td>${it.es_carro ? '<span class="chip ok">CARRO</span>' : `<span class="chip alerta">${it.mbf_est ? it.mbf_est + ' MBF' : 'armar'}</span>`}</td>
    <td>${fmtStatus(it.status)}</td>
    <td class="r num">${u ? (u.est ? '≈' : '') + Math.round(u.v) : '—'}</td>
    ${costoTxt(o.c)}
    <td class="r num" style="color:var(--ok)">${o.dlt === 0 ? '=' : o.dlt}</td>
  </tr>`
}
function tablaFletesMini() {
  const ds = destinos()
  const gs = [...new Set(fletes().map(f => f.grupo_flete))]
  return `<div class="tabla-wrap"><table>
    <tr><th>Grupo de mills</th>${ds.map(d => `<th class="r">${esc(d)}</th>`).join('')}</tr>
    ${gs.map(g => `<tr><td>${esc(g)}<br><span class="nota">${millsDeGrupo(g)}</span></td>${ds.map(d => `<td class="r num">${flete(d, g) ?? '—'}</td>`).join('')}</tr>`).join('')}
  </table></div>
  <p class="nota">Descuento vigente: <b>${(descuento() * 100).toFixed(0)}%</b> sobre US MILL. Edita fletes y descuento en Configuración.</p>`
}
function millsDeGrupo(g) {
  const m = param('mills') || {}
  return Object.entries(m).filter(([k, v]) => v.grupo === g).map(([k]) => k).filter((v, i, a) => a.indexOf(v) === i).join(', ')
}

/* ---------- EXPLORADOR ---------- */
function renderExplorador() {
  const arr = filtrar(itemsVisibles())
  ordenar(arr)
  const F = S.filtros
  const opts = (k) => [...new Set(itemsVisibles().map(i => i[k]).filter(Boolean))].sort()
  $('v-explorador').innerHTML = `
  <div class="card">
    <div class="filtros">
      <select onchange="S.filtros.pestana=this.value;renderExplorador()">
        <option value="">Todas las pestañas</option>
        ${opts('pestana').map(p => `<option ${F.pestana === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <select onchange="S.filtros.size=this.value;renderExplorador()">
        <option value="">Medida</option>
        ${opts('size').map(p => `<option ${F.size === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <select onchange="S.filtros.species=this.value;renderExplorador()">
        <option value="">Especie</option>
        ${opts('species').map(p => `<option ${F.species === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <select onchange="S.filtros.mill=this.value;renderExplorador()">
        <option value="">Mill</option>
        ${opts('mill').map(p => `<option ${F.mill === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <label><input type="checkbox" ${F.prompt ? 'checked' : ''} onchange="S.filtros.prompt=this.checked;renderExplorador()"> Solo prompt</label>
      <label><input type="checkbox" ${F.carros ? 'checked' : ''} onchange="S.filtros.carros=this.checked;renderExplorador()"> Solo carros</label>
      <input type="text" placeholder="Buscar…" value="${esc(F.q)}" oninput="S.filtros.q=this.value;renderExplorador()" style="min-width:140px">
      <span class="nota num">${arr.length} filas</span>
    </div>
    <div class="tabla-wrap" style="max-height:64vh;overflow-y:auto"><table>
      <tr>
        <th><input type="checkbox" onchange="selTodos(this.checked)" title="Seleccionar visibles"></th>
        <th onclick="setSort('producto')">Producto</th>
        <th onclick="setSort('mill')">Mill</th>
        <th>Tally</th>
        <th onclick="setSort('mbf')">Vol</th>
        <th onclick="setSort('status')">Status</th>
        <th class="r" onclick="setSort('chi')">Chicago</th>
        <th class="r" onclick="setSort('usm')">US Mill</th>
        <th class="r" onclick="setSort('c1')">El Paso</th>
        <th class="r" onclick="setSort('c2')">Calexico</th>
        <th class="r" onclick="setSort('valor')">$ Carro/Lote</th>
      </tr>
      ${arr.map(it => filaExp(it)).join('')}
    </table></div>
    <p class="nota">Costos = US MILL × ${(100 - descuento() * 100).toFixed(0)}% + flete. ≈ = estimado (sin US MILL publicado). $ Carro/Lote = MBF × costo ${esc(S.destinoSel)}.</p>
  </div>`
}
function filtrar(arr) {
  const F = S.filtros
  return arr.filter(it =>
    (!F.pestana || it.pestana === F.pestana) &&
    (!F.size || it.size === F.size) &&
    (!F.species || it.species === F.species) &&
    (!F.mill || it.mill === F.mill) &&
    (!F.prompt || it.es_prompt) &&
    (!F.carros || it.es_carro) &&
    (!F.q || (it.producto + ' ' + it.pestana + ' ' + it.grade + ' ' + it.seccion).toLowerCase().includes(F.q.toLowerCase()))
  )
}
function valSort(it, col) {
  if (col === 'producto') return (it.size || '') + (it.grade || '')
  if (col === 'mill') return it.mill || ''
  if (col === 'mbf') return it.mbf_est || 0
  if (col === 'status') return it.status === 'PMT' ? '0' : (it.status || 'z')
  if (col === 'chi') return it.precio_chi ?? 9e9
  if (col === 'usm') { const u = usmillEff(it); return u ? u.v : 9e9 }
  if (col === 'c1') { const c = costo(it, 'El Paso'); return c ? c.v : 9e9 }
  if (col === 'c2') { const c = costo(it, 'Calexico'); return c ? c.v : 9e9 }
  if (col === 'valor') { const c = costo(it, S.destinoSel); return c && it.mbf_est ? c.v * it.mbf_est : 0 }
  return 0
}
function ordenar(arr) { const { col, dir } = S.sort; arr.sort((a, b) => (valSort(a, col) > valSort(b, col) ? 1 : -1) * dir) }
function setSort(col) { S.sort = { col, dir: S.sort.col === col ? -S.sort.dir : 1 }; renderExplorador() }
function filaExp(it) {
  const c1 = costo(it, 'El Paso'), c2 = costo(it, 'Calexico'), cd = costo(it, S.destinoSel)
  const valor = cd && it.mbf_est ? cd.v * it.mbf_est : null
  return `<tr class="${S.sel.has(it.id) ? 'sel-row' : ''}">
    <td><input type="checkbox" ${S.sel.has(it.id) ? 'checked' : ''} onchange="togSel('${it.id}')"></td>
    <td><b>${esc(it.species || '')} ${esc(it.size || '')} ${esc(gradeTxt(it.grade))}</b><br><span class="nota">${esc(it.pestana)}${it.fuente === 'email_lowgrade' ? ' · correo' : ''}</span></td>
    <td>${esc(it.mill || '')}<br><span class="nota">${esc(it.grupo_flete || 'sin flete')}</span></td>
    <td style="white-space:normal;max-width:190px">${esc(tallyTxt(it))}</td>
    <td>${it.es_carro ? '<span class="chip ok">CARRO</span>' : '<span class="chip alerta">armar</span>'}${it.mbf_est ? `<br><span class="nota num">${it.mbf_est} MBF</span>` : ''}</td>
    <td>${fmtStatus(it.status)}</td>

async function cargarSerie() {
  const [size, grade, species] = (S.prodSerie || '||').split('|')
  const box = $('serie-chart'); if (!box) return
  try {
    const r = await api('serie', { size, grade, species: species || undefined })
    const pts = {}
    for (const row of r.serie) {
      let v = null
      if (S.serieModo === 'chi') v = row.precio_chi == null ? null : parseFloat(row.precio_chi)
      else if (row.precio_usmill != null) v = parseFloat(row.precio_usmill)
      else if (row.precio_cdnmill != null) v = parseFloat(row.precio_cdnmill) / factorCdn()
      if (v == null) continue
      const f = row.tolko_listas.fecha
      const m = row.mill || '?'
      pts[m] = pts[m] || {}
      pts[m][f] = pts[m][f] == null ? v : Math.min(pts[m][f], v)
    }
    box.innerHTML = svgSerie(pts) || '<p class="nota">Sin datos para esta combinación en este modo.</p>'
  } catch (e) { box.innerHTML = `<p class="nota" style="color:var(--riesgo)">Error: ${esc(e.message)}</p>` }
}
function svgSerie(pts) {
  const mills = Object.keys(pts)
  if (!mills.length) return ''
  const fechas = [...new Set(mills.flatMap(m => Object.keys(pts[m])))].sort()
  const vals = mills.flatMap(m => Object.values(pts[m]))
  if (!vals.length) return ''
  const min = Math.min(...vals), max = Math.max(...vals)
  const pad = Math.max(8, (max - min) * .15), lo = min - pad, hi = max + pad
  const W = 760, H = 240, L = 46, R = 12, T = 12, B = 28
  const x = f => L + (fechas.length === 1 ? (W - L - R) / 2 : (W - L - R) * fechas.indexOf(f) / (fechas.length - 1))
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo))
  const colores = { HVT: 'var(--acc)', LVT: 'var(--acc2)', LD: 'var(--info)', AL: 'var(--alerta)', SC: 'var(--riesgo)', QUT: 'var(--faint)' }
  let s = `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px">`
  s += `<line x1="${L}" y1="${y(lo)}" x2="${W - R}" y2="${y(lo)}" stroke="var(--line)"/>`
  for (const v of [min, max]) s += `<text x="4" y="${y(v) + 4}" font-size="11" fill="var(--faint)" class="num">${Math.round(v)}</text><line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>`
  for (const f of fechas) s += `<text x="${x(f)}" y="${H - 8}" font-size="10.5" fill="var(--faint)" text-anchor="middle">${fmtFecha(f)}</text>`
  for (const m of mills) {
    const c = colores[m] || 'var(--sub)'
    const fs = fechas.filter(f => pts[m][f] != null)
    s += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${fs.map(f => x(f) + ',' + y(pts[m][f])).join(' ')}"/>`
    for (const f of fs) s += `<circle cx="${x(f)}" cy="${y(pts[m][f])}" r="3.4" fill="${c}"/><text x="${x(f)}" y="${y(pts[m][f]) - 7}" font-size="10.5" fill="${c}" text-anchor="middle" class="num">${Math.round(pts[m][f])}</text>`
  }
  s += '</svg></div><div class="leyenda">' + mills.map(m => `<span class="chip neutro" style="color:${colores[m] || 'var(--sub)'}">● ${m}</span>`).join('') + '</div>'
  return s
}

function resumenParseo(items, warnings) {
  const por = {}
  for (const it of items) { por[it.pestana] = (por[it.pestana] || 0) + 1 }
  return `<p class="nota">${items.length} items: ${Object.entries(por).map(([k, n]) => `${esc(k)} (${n})`).join(' · ')}</p>` +
    (warnings.length ? `<p class="nota" style="color:var(--alerta)">${warnings.map(esc).join('<br>')}</p>` : '')

async function cargarExcel() {
  const f = $('file-xlsx').files[0]
  if (!f) return toast('Elige el archivo .xlsx', true)
  try {
    const buf = await f.arrayBuffer()
    const wb = XLSX.read(buf, { cellDates: true })
    const sheets = {}
    for (const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null })
    let fecha = $('fecha-xlsx').value
    const meses = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 }
    const m = f.name.match(/([A-Za-z]+)_(\d{1,2})(?:st|nd|rd|th)?_(\d{4})/)
    if (m && meses[m[1].toLowerCase()]) fecha = `${m[3]}-${String(meses[m[1].toLowerCase()]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`
    const esCDN = /_CDN/i.test(f.name)
    const { items, warnings } = TolkoParser.parseWorkbook(sheets, { fecha })
    $('prev-xlsx').innerHTML = resumenParseo(items, warnings)
    if (!items.length) return toast('No se encontraron items — ¿cambió el formato?', true)
    const r = await api('ingest', { fecha, fuente: esCDN ? 'xlsx_cdn' : 'xlsx_semanal', titulo: `Tolko ${esCDN ? 'Canadian' : 'U.S.'} Sales List — ${fecha}`, archivo: f.name, items })
    toast(`Guardado: ${r.n} items (${fecha})`)
    await cargarBoot()
  } catch (e) { toast('Error: ' + e.message, true) }
}

    const r = await api('ingest', { fecha, fuente: 'email_lowgrade', titulo: `Tolko Low Grade — ${fecha}`, archivo: 'pegado manual', items })
    toast(`Guardado: ${r.n} items (${fecha})`)
    await cargarBoot()
  } catch (e) { toast('Error: ' + e.message, true) }
}

/* ---------- tema ---------- */
function aplicarTema() {
  const t = localStorage.tolkoTema || 'auto'
  if (t === 'auto') document.documentElement.removeAttribute('data-theme')
  else document.documentElement.setAttribute('data-theme', t)
  $('tema-btn').textContent = 'Tema: ' + (t === 'auto' ? 'Auto' : t === 'light' ? 'Día' : 'Noche')
}
function ciclarTema() {
  const orden = ['auto', 'light', 'dark']
  const t = localStorage.tolkoTema || 'auto'
  localStorage.tolkoTema = orden[(orden.indexOf(t) + 1) % 3]
  aplicarTema()
}

/* ---------- init ---------- */
aplicarTema()
$('clave-in').addEventListener('keydown', e => { if (e.key === 'Enter') entrar() })
if (S.clave) {
  cargarBoot().then(() => $('login').classList.add('oculto')).catch(() => {})
}
</script>
</body>
</html>
